name: Windows validation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Native build prerequisites
        run: choco install strawberryperl make --no-progress -y
      - name: Frontend dependencies
        run: npm ci
      - name: Frontend checks
        run: npm run build
      - name: Rust unit tests
        working-directory: src-tauri
        run: cargo test --lib
      - name: Build Windows NSIS and MSI installers
        run: npx tauri build --bundles nsis,msi
      - name: Package and verify app, installers and portable ZIP
        shell: pwsh
        run: |
          python -m pip install pefile
          python scripts/package-windows.py
          if ($LASTEXITCODE -ne 0) { throw "Release verification failed" }
      - name: Check MSI identity and embedded icon table
        shell: pwsh
        run: |
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $path = (Resolve-Path release-assets/Mirsa-Setup.msi).Path
          $db = $installer.OpenDatabase($path, 0)
          $view = $db.OpenView('SELECT `Property`, `Value` FROM `Property`')
          $view.Execute()
          $props = @{}
          while ($row = $view.Fetch()) { $props[$row.StringData(1)] = $row.StringData(2) }
          if ($props.ProductName -ne 'Mirsa' -or $props.ProductVersion -ne '0.1.1') { throw "Wrong MSI identity" }
          $view = $db.OpenView('SELECT `Name` FROM `Icon`')
          $view.Execute()
          if (!$view.Fetch()) { throw "MSI lacks icon" }
          $props | ConvertTo-Json | Out-File release-assets/msi-properties.json
          Write-Host "MSI identity and icon table verified"
      - uses: actions/upload-artifact@v4
        with:
          name: Mirsa-Windows-x64
          if-no-files-found: error
          path: release-assets/*
          retention-days: 14
